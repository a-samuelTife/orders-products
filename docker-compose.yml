services:
  products:
    build: ./products
    image: products:dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  orders:
    build: ./orders
    image: orders:dev
    environment:
      PRODUCTS_URL: http://products:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      products:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      products:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - backend

networks:
  backend: